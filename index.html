
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gujarat Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Gujarat Weather App</h1>

        <p>
            Check temperature of cities across Gujarat only.
        </p>

        <input
            type="text"
            id="cityInput"
            placeholder="Enter Gujarat city name"
            autofocus
        >

        <p id="result"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
